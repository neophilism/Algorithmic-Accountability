name: Public preview smoke monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: public-preview-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify public preview pages and fictional data markers
        env:
          PREVIEW_BASE_URL: https://algorithmic-accountability-preview.onrender.com
          SMOKE_ATTEMPTS: "4"
        run: node scripts/preview-smoke.mjs
